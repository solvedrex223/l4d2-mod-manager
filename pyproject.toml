[project]
name = "mod-manager"
version = "0.1.0"
description = "Mod manager for Left 4 Dead 2: categories, groups, conflict detection and load-order randomization"
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.14,<3.16"
dependencies = [
    "vpk (>=1.4.0,<2.0.0)",
    "pyside6 (>=6.12.0,<7.0.0)",
    "platformdirs (>=4.14.5,<5.0.0)",
    "rapidfuzz (>=3.14.6,<4.0.0)",
    "requests (>=2.34.2,<3.0.0)"
]

[project.scripts]
mod-manager = "mod_manager.app:main"

[tool.poetry]
packages = [{include = "mod_manager", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "pyinstaller (>=6.22.3,<7.0.0)",
    "pillow (>=13.0.0,<14.0.0)"
]
